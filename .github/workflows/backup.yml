name: Backup

# Nightly dump of the Supabase database into a separate private repo, plus a keep-alive call so the
# free project doesn't pause. Free projects have no backups of their own. A second job checks the
# pipeline is healthy (scripts/health.sql) and opens an issue when it isn't.
#
# Needs these repository secrets:
#   SUPABASE_DB_URL            Session pooler connection string (GitHub runners have no IPv6, so
#                              not the direct db.<ref>.supabase.co one), with the database password
#   SUPABASE_URL               https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY   sb_publishable_…, the same key the app ships with
#   BACKUP_REPO_TOKEN          Fine-grained token with Contents read/write on the backup repo only
# and this repository variable:
#   BACKUP_REPO                owner/name of the private backup repo
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Report a fake problem, to check the alert reaches your phone
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only needed so setup-cli picks the CLI version from package-lock.json.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3

      # Runs before the dump, so the project stays awake even if the dump fails.
      - name: Keep alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 -o /dev/null \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_snapshot" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup

      # Plain SQL at fixed paths, so git stores each night as a small diff and the history is the
      # list of past backups. Push devices and their deliveries are left out: git history would keep
      # them after a user deletes them (the privacy policy says it doesn't), and phones re-register on
      # their next launch anyway.
      - name: Dump roles, schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy \
            -x public.devices,public.alert_state,public.deliveries

      - name: Push to backup repo
        working-directory: backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roles.sql schema.sql data.sql
          if git diff --cached --quiet; then
            echo 'No changes since the last backup.'
          else
            git commit -m "Backup $(date -u +%F)"
            git push
          fi

  health:
    name: Check the pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GitHub Mobile pushes issue assignments and @mentions but not workflow runs, so problems go to
      # one open issue assigned to the repo owner: opened on the first failure, a comment mentioning
      # them on each failure after that, closed once healthy. Each problem is also an error
      # annotation on the run.
      - name: Look for stale scores and failing jobs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if ! problems=$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -f scripts/health.sql 2>&1); then
            problems="The health query itself failed: $(tail -n 1 <<< "$problems")"
          fi
          if [ "$TEST_ALERT" = true ]; then
            problems=$(printf '%s\n%s' "$problems" 'Test alert from a manual run; nothing is wrong.' | sed '/^$/d')
          fi

          gh label create pipeline-health --color B60205 --description 'Nightly health check' --force
          issue=$(gh issue list --label pipeline-health --state open --json number -q '.[0].number')

          if [ -z "$problems" ]; then
            echo 'No problems found.'
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "Healthy again: $RUN_URL"; fi
            exit 0
          fi

          while IFS= read -r problem; do echo "::error::$problem"; done <<< "$problems"
          list=$(sed 's/^/- /' <<< "$problems")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$(printf '@%s still failing:\n\n%s\n\n%s' "$OWNER" "$list" "$RUN_URL")"
          else
            gh issue create --title 'Pipeline health check failed' --label pipeline-health --assignee "$OWNER" \
              --body "$(printf 'The nightly health check found:\n\n%s\n\n%s\n\nThis closes itself once the check passes.' "$list" "$RUN_URL")"
          fi
          exit 1
