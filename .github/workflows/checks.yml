name: Checks

# Every branch push is checked, which also covers pull requests from branches in this repo.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typed routes live in .expo/types and expo-env.d.ts, which are gitignored and normally
      # written by `expo start`. Without them tsc still passes but stops checking route strings.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

      # Edge functions are Deno code, so tsc and ESLint skip them. Each function has its own
      # deno.json, so each is checked from its own folder. Shared code is checked through them.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check edge functions
        run: |
          shopt -s nullglob
          for entry in supabase/functions/*/index.ts; do
            echo "deno check $entry"
            (cd "$(dirname "$entry")" && deno check index.ts)
          done

      # Shared helpers have no npm imports, so they need no import map.
      - name: Test edge function helpers
        working-directory: supabase/functions/_shared
        run: deno test --no-lock
