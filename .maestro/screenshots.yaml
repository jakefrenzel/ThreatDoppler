# App Store screenshots, run by .github/workflows/screenshots.yml on an iPhone Pro Max simulator.
# Goes through onboarding with the default sectors, then captures each screen. Files are numbered
# in the order they should appear on the App Store.
appId: com.threatdoppler.app
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# Onboarding
- extendedWaitUntil:
    visible: "Who are you?"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Continue"
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Set your scope"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Continue"
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "When should we tell you?"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Continue"
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Allow notifications?"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Allow notifications"
- tapOn: "Allow notifications"

# Now: wait for live data and the count-up and chart reveal to finish.
- extendedWaitUntil:
    visible:
      id: "now-breakdown"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "01-now"

- tapOn: "Forecast"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "02-forecast"

- tapOn: "Feed"
- extendedWaitUntil:
    visible: "Live feed"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "03-feed"

# The first event's detail sheet, then swipe it away. Early in the UTC day the feed can be empty,
# so this one is skipped then; run again later for a fuller feed.
- runFlow:
    when:
      visible:
        id: "feed-event"
    commands:
      - tapOn:
          id: "feed-event"
          index: 0
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: "04-event"
      - swipe:
          start: 50%, 15%
          end: 50%, 90%
      - waitForAnimationToEnd:
          timeout: 5000

- tapOn: "Alerts"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "05-alerts"

- tapOn: "Now"
- tapOn:
    id: "now-breakdown"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "06-breakdown"
